name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # go.sum isn't committed yet, so this resolves and locks dependencies on
      # every run. Once it's committed, this becomes a no-op verification.
      - name: Resolve dependencies
        run: go mod tidy

      - name: Check gofmt
        run: |
          fmt_out="$(gofmt -s -l .)"
          if [ -n "$fmt_out" ]; then
            echo "not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # Convenience for developing without a local Go toolchain: download this
      # from the run's summary page and commit it to lock dependency versions.
      - name: Upload go.sum
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go.sum
          path: go.sum
          if-no-files-found: ignore
